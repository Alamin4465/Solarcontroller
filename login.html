<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>লগইন / রেজিস্ট্রেশন - সোলার স্মার্ট কন্ট্রোলার</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="card">
        <div class="header">
            <i class="fas fa-solar-panel"></i>
            <h1>সোলার স্মার্ট কন্ট্রোলার</h1>
            <p>আপনার সোলার সিস্টেম কন্ট্রোল করুন</p>
        </div>
        
        <div class="tabs">
            <button class="tab active" data-tab="login">
                <i class="fas fa-sign-in-alt"></i> লগইন
            </button>
            <button class="tab" data-tab="register">
                <i class="fas fa-user-plus"></i> রেজিস্ট্রেশন
            </button>
        </div>
        
        <div class="form-container">
            <div id="loginForm" class="form active">
                <form id="loginFormElement">
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="loginEmail" placeholder="ইমেইল" required>
                    </div>
                    
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="পাসওয়ার্ড" required>
                        <i class="fas fa-eye toggle-password" data-target="loginPassword"></i>
                    </div>
                    
                    <div class="links">
                        <label class="remember-me">
                            <input type="checkbox" id="rememberMe"> মনে রাখুন
                        </label>
                    </div>
                    
                    <button type="submit" class="btn" id="loginBtn">
                        <i class="fas fa-sign-in-alt"></i> লগইন
                    </button>
                    
                    <div class="forgot-password">
                        <a href="#" id="forgotPasswordLink">পাসওয়ার্ড ভুলে গেছেন?</a>
                    </div>
                </form>
            </div>
            
            <div id="registerForm" class="form">
                <form id="registerFormElement">
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="regName" placeholder="আপনার নাম" required>
                    </div>
                    
                    <div class="input-group">
                        <i class="fas fa-calendar-alt"></i>
                        <input type="date" id="regDob" required>
                    </div>
                    
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="regEmail" placeholder="ইমেইল" required>
                    </div>
                    
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="regPassword" placeholder="পাসওয়ার্ড" required>
                        <i class="fas fa-eye toggle-password" data-target="regPassword"></i>
                    </div>
                    
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="regConfirmPassword" placeholder="পাসওয়ার্ড নিশ্চিত করুন" required>
                        <i class="fas fa-eye toggle-password" data-target="regConfirmPassword"></i>
                    </div>
                    
                    <div class="strength-meter">
                        <div class="strength-meter-fill" id="strengthFill"></div>
                    </div>
                    <div class="strength-text" id="strengthText"></div>
                    
                    <div class="terms">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">
                            আমি <a href="#">শর্তাবলী</a> এবং <a href="#">গোপনীয়তা নীতি</a> মেনে নিচ্ছি
                        </label>
                    </div>
                    
                    <button type="submit" class="btn" id="registerBtn">
                        <i class="fas fa-user-plus"></i> রেজিস্ট্রেশন
                    </button>
                </form>
            </div>
        </div>
    </div>
    
    <div id="toast" class="toast"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, setPersistence, browserLocalPersistence, browserSessionPersistence, sendPasswordResetEmail, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-database.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyBP9zk3Y8wBBCfvnRKmcExMP-uIbINuTwc",
            authDomain: "solar-panel-c798c.firebaseapp.com",
            databaseURL: "https://solar-panel-c798c-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "solar-panel-c798c",
            storageBucket: "solar-panel-c798c.firebasestorage.app",
            messagingSenderId: "619952775462",
            appId: "1:619952775462:web:f7c42fef5b7178c42c21e7"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);
        
        // =============== ইউজার আইডি এবং ডিভাইস আইডি জেনারেটর ===============
        
        // ইউজার আইডি: SolarController_[User Name]
        function generateUserId(userName) {
            let cleanName = userName.trim().replace(/\s+/g, '_');
            cleanName = cleanName.replace(/[^a-zA-Z0-9_]/g, '');
            return `SolarController_${cleanName}`;
        }
        
        // ডিভাইস আইডি: ESP32_[User Name]_[Hash]
        function generateDeviceId(userName, email) {
            const cleanEmail = email.toLowerCase().trim();
            let hash = 0;
            for (let i = 0; i < cleanEmail.length; i++) {
                hash = ((hash << 5) - hash) + cleanEmail.charCodeAt(i);
                hash = hash & hash;
            }
            const hashHex = Math.abs(hash).toString(16).substring(0, 8).toUpperCase();
            
            let cleanName = userName.trim().replace(/\s+/g, '_');
            cleanName = cleanName.replace(/[^a-zA-Z0-9_]/g, '').substring(0, 15);
            
            return `ESP32_${cleanName}_${hashHex}`;
        }
        
        // নাম ফরম্যাট করা
        function formatDisplayName(name) {
            return name.trim();
        }
        
        function showToast(message, type = "info") {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove("show"), 3000);
        }
        
        // Tab switching
        document.querySelectorAll(".tab").forEach(tab => {
            tab.addEventListener("click", () => {
                const tabName = tab.getAttribute("data-tab");
                document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
                tab.classList.add("active");
                
                document.getElementById("loginForm").classList.toggle("active", tabName === "login");
                document.getElementById("registerForm").classList.toggle("active", tabName === "register");
            });
        });
        
        // Toggle password
        document.querySelectorAll(".toggle-password").forEach(icon => {
            icon.addEventListener("click", function() {
                const input = document.getElementById(this.getAttribute("data-target"));
                if (input.type === "password") {
                    input.type = "text";
                    this.classList.remove("fa-eye");
                    this.classList.add("fa-eye-slash");
                } else {
                    input.type = "password";
                    this.classList.remove("fa-eye-slash");
                    this.classList.add("fa-eye");
                }
            });
        });
        
        // Password strength
        const regPassword = document.getElementById("regPassword");
        if (regPassword) {
            regPassword.addEventListener("input", function() {
                const password = this.value;
                let strength = 0;
                if (password.length >= 6) strength++;
                if (password.length >= 10) strength++;
                if (/[A-Z]/.test(password)) strength++;
                if (/[0-9]/.test(password)) strength++;
                if (/[^A-Za-z0-9]/.test(password)) strength++;
                
                const fill = document.getElementById("strengthFill");
                const text = document.getElementById("strengthText");
                
                if (password.length === 0) {
                    fill.className = "strength-meter-fill";
                    fill.style.width = "0%";
                    text.textContent = "";
                } else if (strength <= 2) {
                    fill.className = "strength-meter-fill weak";
                    text.textContent = "দুর্বল পাসওয়ার্ড";
                } else if (strength <= 3) {
                    fill.className = "strength-meter-fill medium";
                    text.textContent = "মাঝারি পাসওয়ার্ড";
                } else if (strength <= 4) {
                    fill.className = "strength-meter-fill strong";
                    text.textContent = "শক্তিশালী পাসওয়ার্ড";
                } else {
                    fill.className = "strength-meter-fill very-strong";
                    text.textContent = "অত্যন্ত শক্তিশালী পাসওয়ার্ড";
                }
            });
        }
        
        // =============== লগইন ===============
        document.getElementById("loginFormElement").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value;
            const rememberMe = document.getElementById("rememberMe").checked;
            
            if (!email || !password) {
                showToast("ইমেইল এবং পাসওয়ার্ড দিন!", "error");
                return;
            }
            
            await setPersistence(auth, rememberMe ? browserLocalPersistence : browserSessionPersistence);
            
            const btn = document.getElementById("loginBtn");
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> লগইন হচ্ছে...';
            
            try {
                await signInWithEmailAndPassword(auth, email, password);
                showToast("লগইন সফল!", "success");
                if (rememberMe) localStorage.setItem("rememberedEmail", email);
                else localStorage.removeItem("rememberedEmail");
                setTimeout(() => { window.location.href = "index.html"; }, 1000);
            } catch (error) {
                let msg = "লগইন ব্যর্থ হয়েছে!";
                if (error.code === 'auth/invalid-credential') msg = "ইমেইল বা পাসওয়ার্ড ভুল!";
                else if (error.code === 'auth/too-many-requests') msg = "অনেক চেষ্টা করেছেন! কিছুক্ষণ পরে চেষ্টা করুন।";
                showToast(msg, "error");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> লগইন';
            }
        });
        
        // =============== ফরগট পাসওয়ার্ড ===============
        document.getElementById("forgotPasswordLink").addEventListener("click", async (e) => {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value.trim();
            if (!email) {
                showToast("পাসওয়ার্ড রিসেট করতে আপনার ইমেইল দিন!", "error");
                return;
            }
            try {
                await sendPasswordResetEmail(auth, email);
                showToast("পাসওয়ার্ড রিসেট লিংক আপনার ইমেইলে পাঠানো হয়েছে!", "success");
            } catch (error) {
                showToast(error.code === 'auth/user-not-found' ? "এই ইমেইলে কোন অ্যাকাউন্ট নেই!" : "পাসওয়ার্ড রিসেট ব্যর্থ!", "error");
            }
        });
        
        // =============== রেজিস্ট্রেশন ===============
        document.getElementById("registerFormElement").addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const name = document.getElementById("regName").value.trim();
            const dob = document.getElementById("regDob").value;
            const email = document.getElementById("regEmail").value.trim();
            const password = document.getElementById("regPassword").value;
            const confirmPassword = document.getElementById("regConfirmPassword").value;
            const terms = document.getElementById("terms").checked;
            
            if (!name || !dob || !email || !password || !confirmPassword) {
                showToast("সব তথ্য পূরণ করুন!", "error");
                return;
            }
            if (password !== confirmPassword) {
                showToast("পাসওয়ার্ড মেলে না!", "error");
                return;
            }
            if (password.length < 6) {
                showToast("পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে!", "error");
                return;
            }
            if (!terms) {
                showToast("শর্তাবলী মেনে নিতে হবে!", "error");
                return;
            }
            
            const btn = document.getElementById("registerBtn");
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> রেজিস্ট্রেশন হচ্ছে...';
            
            try {
                // Firebase Authentication এ ইউজার তৈরি
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(userCredential.user, { displayName: name });
                
                // ইউজার আইডি এবং ডিভাইস আইডি জেনারেট
                const userId = generateUserId(name);
                const deviceId = generateDeviceId(name, email);
                const displayName = formatDisplayName(name);
                
                console.log("Generated User ID:", userId);
                console.log("Generated Device ID:", deviceId);
                
                // =============== ডাটাবেস স্ট্রাকচার ===============
                // Users/{userId}/
                await set(ref(database, `Users/${userId}`), {
                    user_name: displayName,
                    email: email,
                    dob: dob,
                    device_id: deviceId,
                    created_at: Date.now(),
                    last_login: Date.now(),
                    status: 'active'
                });
                
                // Devices/{userId}/{deviceId}/
                await set(ref(database, `Devices/${userId}/${deviceId}`), {
                    device_name: `${displayName} এর সোলার কন্ট্রোলার`,
                    user_id: userId,
                    user_email: email,
                    created_at: Date.now(),
                    status: 'active',
                    last_updated: Date.now(),
                    device_info: {
                        type: 'ESP32_SOLAR_CONTROLLER',
                        model: 'SOLAR_001',
                        version: '1.0.0'
                    },
                    data: {
                        current_data: {
                            solar_voltage: 13.5,
                            solar_current: 2.5,
                            battery_voltage: 12.8,
                            battery_current: 1.2,
                            battery_soc: 75,
                            load_voltage: 12.6,
                            load_current: 1.8,
                            dust_level: 45,
                            efficiency: 85,
                            brush_status: 'stopped',
                            pump_status: 'off',
                            timestamp: Date.now()
                        },
                        system_status: {
                            mode: 'manual',
                            power_source: 'grid',
                            brush_mode: 'auto',
                            last_updated: Date.now(),
                            auto_mode_running: false,
                            current_reason: 'সিস্টেম স্টার্ট'
                        },
                        settings: {
                            auto_mode_thresholds: {
                                SOLAR_MIN_VOLTAGE: 12.5,
                                SOLAR_GOOD_VOLTAGE: 13.0,
                                BATTERY_MIN_VOLTAGE: 11.8,
                                BATTERY_CRITICAL_SOC: 25,
                                BATTERY_GOOD_SOC: 40
                            }
                        },
                        alerts: [],
                        history: [],
                        commands: {}
                    }
                });
                
                // main.js এর জন্য টেম্পোরারি ডাটা সংরক্ষণ
                localStorage.setItem('tempUserName', displayName);
                localStorage.setItem('tempDob', dob);
                localStorage.setItem('tempUserId', userId);
                localStorage.setItem('tempDeviceId', deviceId);
                
                showToast("রেজিস্ট্রেশন সফল!", "success");
                
                setTimeout(() => {
                    document.querySelector('.tab[data-tab="login"]').click();
                    document.getElementById("loginEmail").value = email;
                    showToast("এখন লগইন করুন", "success");
                }, 1500);
                
            } catch (error) {
                console.error("Registration error:", error);
                let msg = "রেজিস্ট্রেশন ব্যর্থ হয়েছে!";
                if (error.code === 'auth/email-already-in-use') msg = "এই ইমেইল ইতিমধ্যে ব্যবহার করা হয়েছে!";
                else if (error.code === 'auth/weak-password') msg = "পাসওয়ার্ড খুব সহজ! কমপক্ষে ৬ অক্ষর দিন။";
                showToast(msg, "error");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> রেজিস্ট্রেশন';
            }
        });
        
        // Load remembered email
        const rememberedEmail = localStorage.getItem("rememberedEmail");
        if (rememberedEmail) {
            document.getElementById("loginEmail").value = rememberedEmail;
            document.getElementById("rememberMe").checked = true;
        }
        
        // Redirect if already logged in
        auth.onAuthStateChanged((user) => {
            if (user && window.location.pathname.includes("login.html")) {
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>
